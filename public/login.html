<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Inova PDF</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fb; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; width: 320px; }
        h2 { color: #007acc; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 1em; }
        button { background: #007acc; color: white; border: none; width: 100%; padding: 12px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 15px; font-size: 1em; }
        button:hover { background: #005999; }
        .erro { color: red; font-size: 0.9em; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acesso Inova PDF</h2>
        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="realizarLogin()">Entrar</button>
        <div id="msgErro" class="erro">Usuário ou senha incorretos!</div>
    </div>

    <script>
        function realizarLogin() {
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('senha').value;

            // Validação estrita solicitada
            if (user === 'lucasPeruffo' && pass === 'inovaSenha5560') {
                // Guarda um token temporário no navegador do usuário
                localStorage.setItem('inova_autenticado', 'true');
                // Redireciona para o painel principal do sistema
                window.location.href = '/index.html';
            } else {
                document.getElementById('msgErro').style.display = 'block';
            }
        }
    </script>
</body>
</html>
